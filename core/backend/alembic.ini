# NeuroSync — Alembic configuration (blueprint 09 §4).
#
# The database URL is NOT stored here. `alembic/env.py` reads it from
# NEUROSYNC_DATABASE_URL via app.config, so migrations and the running app can
# never disagree about which database they mean, and no credential lands in git.
#
#   ./venv/Scripts/python.exe -m alembic upgrade head
#   ./venv/Scripts/python.exe -m alembic revision --autogenerate -m "add x"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revisions are named 0001_, 0002_… so `ls` shows them in apply order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
