version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEUROSYNC_STATE_BACKEND=sql
      - NEUROSYNC_DATABASE_URL=postgresql+psycopg://neurosync:neurosync_pass@db:5432/neurosync_db
      - NEUROSYNC_SECRET_KEY=neurosync-prod-secret-key-2026
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neurosync
      POSTGRES_PASSWORD: neurosync_pass
      POSTGRES_DB: neurosync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurosync -d neurosync_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
